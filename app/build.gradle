// ════════════════════════════════════════════════════════
// ImpulsoTV v3 — Native Player (sem WebView)
// Dependências escolhidas:
//   Media3 ExoPlayer → vídeo nativo gapless (sem tela preta)
//   OkHttp           → HTTP REST + WebSocket Supabase Realtime
//   Coil             → imagens (Kotlin-native, leve)
//   Gson             → parsing JSON do Supabase
//   Coroutines       → async sem callbacks aninhados
// ════════════════════════════════════════════════════════
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// ── Assinatura de release (5.3) ──────────────────────────────────────
// Lê keystore.properties (NÃO versionado — ver keystore.properties.example).
// Sem o arquivo, o release cai na chave de debug, com aviso no build.
// Procura no projeto e, se não houver, na pasta acima (fora do repositório)
def keystorePropsFile = rootProject.file('keystore.properties')
if (!keystorePropsFile.exists()) keystorePropsFile = rootProject.file('../keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    namespace 'com.impulsolab.impulsotv'
    compileSdk 34

    defaultConfig {
        applicationId "com.impulsolab.impulsotv"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "3.4.0"

        // ── Supabase config via BuildConfig ──────────────────────
        // Preencha com seus valores do Supabase Dashboard:
        //   Settings → API → Project URL e anon key
        buildConfigField "String", "SUPABASE_URL",      '"https://gebzekmmqyjaaqadwfki.supabase.co"'
        buildConfigField "String", "SUPABASE_ANON_KEY", '"sb_publishable_GMWgH4XbaVIfPxpsySCKEg_TXae9-v8"'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile     rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias      keystoreProps['keyAlias']
                keyPassword   keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("⚠️  keystore.properties ausente — release assinado com a chave de DEBUG")
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.core:core:1.12.0'

    // ── Vídeo nativo: Media3 ExoPlayer ───────────────────────────
    // Substitui o <video> do WebView. Pre-buffer automático da
    // próxima mídia → zero frame preto entre vídeos consecutivos.
    def media3_version = "1.3.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"

    // ── HTTP + WebSocket (Supabase REST + Realtime) ───────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ── Imagens (Kotlin-native, suporta Coroutines) ───────────────
    implementation 'io.coil-kt:coil:2.6.0'

    // ── JSON (parsing das respostas do Supabase) ──────────────────
    implementation 'com.google.code.gson:gson:2.10.1'

    // ── Coroutines ────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── Room Database (Cache Offline) ───────────────────────────────
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
}
